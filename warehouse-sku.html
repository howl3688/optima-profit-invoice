<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梅侍料號小幫手 · 奧提瑪工具箱</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--accent:#FF6B6B;--accent-d:#e85555;--dark:#1a1a2e;--ink:#222;--mut:#888;--line:#e5e7eb;--bg:#f0f2f5}
  body{font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  #pw-screen{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999}
  #pw-screen.hide{display:none}
  .pw-box{background:#fff;border-radius:16px;padding:44px 36px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .pw-ic{width:60px;height:60px;border-radius:14px;background:var(--accent);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:28px}
  .pw-box h2{font-size:18px;margin-bottom:6px;color:var(--dark)}
  .pw-box p{font-size:13px;color:#888;margin-bottom:20px}
  .pw-box input{width:100%;padding:12px;border:2px solid var(--line);border-radius:8px;font-size:16px;text-align:center;letter-spacing:3px;outline:none;font-family:inherit}
  .pw-box input:focus{border-color:var(--accent)}
  .pw-box button{margin-top:14px;width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .pw-box button:hover{background:var(--accent-d)}
  .pw-err{color:#c33;font-size:13px;margin-top:10px;min-height:18px}
  header{background:var(--dark);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
  .h-l{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:17px}
  .h-l .ic{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px}
  .back{color:#bbb;text-decoration:none;font-size:13px;border:1px solid #3a3a52;padding:7px 13px;border-radius:8px;transition:.15s}
  .back:hover{color:#fff;border-color:#fff}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
  .tabs{display:flex;gap:8px;margin-bottom:22px}
  .tab{flex:1;max-width:230px;background:#fff;border:2px solid transparent;border-radius:12px;padding:14px 18px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:#555;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:.15s;display:flex;align-items:center;gap:10px}
  .tab .e{font-size:20px}
  .tab.on{border-color:var(--accent);color:var(--dark)}
  .tab:hover{border-color:var(--accent)}
  .panel{display:none}.panel.on{display:block}
  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 14px rgba(0,0,0,.06);margin-bottom:18px}
  .card h2{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:12.5px;color:var(--mut);margin-bottom:16px;line-height:1.6}
  label.fl{display:block;font-size:12px;font-weight:700;color:#666;margin:0 0 6px}
  input[type=text],select{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;outline:none;transition:.15s;background:#fff}
  input[type=text]:focus,select:focus{border-color:var(--accent)}
  .big-in{font-size:17px;padding:14px 16px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .chip{font-size:12.5px;padding:5px 11px;border-radius:20px;background:#f3f4f6;color:#555;display:inline-flex;align-items:center;gap:5px}
  .chip b{color:var(--dark)}
  .chip.ok{background:#eafbf0;color:#1a8a4a}
  .chip.ask{background:#fff4e0;color:#b8791a}
  /* 產生結果 */
  .out{margin-top:20px;border-top:1px dashed var(--line);padding-top:20px}
  .sku-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sku{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--dark);background:#fafafa;border:2px solid var(--line);border-radius:10px;padding:10px 18px;flex:1;min-width:240px}
  .copy{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
  .copy:hover{background:var(--accent-d)}
  .copy.done{background:#1a8a4a}
  .warn{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.6;display:none}
  .warn.dup{display:block;background:#fdecec;border:1px solid #f5b5b5;color:#b12}
  .warn.newok{display:block;background:#eafbf0;border:1px solid #b6e6c8;color:#1a7a42}
  .warn b{font-weight:800}
  .pv{font-size:12px;color:var(--mut);margin-top:8px}
  .pv code{background:#f3f4f6;padding:1px 6px;border-radius:4px;font-size:12px}
  /* 查詢 */
  .search-wrap{position:relative;margin-bottom:14px}
  .search-wrap input{padding-left:40px}
  .search-wrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:#aaa}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .fbtn{font-size:12.5px;padding:6px 13px;border-radius:20px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:#666;transition:.12s}
  .fbtn.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  thead{background:#f7f8fa}
  th{background:#f7f8fa;text-align:left;padding:10px 12px;font-size:11.5px;color:#888;font-weight:700;white-space:nowrap}
  td{padding:9px 12px;border-top:1px solid #f0f0f0;vertical-align:top}
  td.mono{font-family:'SF Mono',Menlo,Consolas,monospace;font-weight:700;color:var(--dark);white-space:nowrap}
  tr:hover td{background:#fafbfc}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:700;white-space:nowrap}
  .b-A{background:#fff0f0;color:#d14}.b-B{background:#f0eeff;color:#63c}.b-S{background:#e0faf8;color:#0a9}
  .b-G{background:#fff8e0;color:#b80}.b-M{background:#eef1f5;color:#556}
  .st{font-size:10.5px;color:#999}
  .st.off{color:#c33}
  .cnt{font-size:12px;color:var(--mut);margin:2px 2px 12px}
  .empty{text-align:center;color:#aaa;padding:40px;font-size:14px}
  .foot{text-align:center;color:#bbb;font-size:11.5px;margin-top:8px}
  @media(max-width:600px){.tab .e{display:none}.sku{font-size:20px}}
</style>
</head>
<body>
<div id="pw-screen">
  <div class="pw-box">
    <div class="pw-ic">📦</div>
    <h2>梅侍料號小幫手</h2>
    <p>請輸入工具箱密碼</p>
    <input type="password" id="pw-input" placeholder="••••••" maxlength="20" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">進入</button>
    <div class="pw-err" id="pw-error"></div>
  </div>
</div>
<header>
  <div class="h-l"><span class="ic">📦</span>梅侍料號小幫手</div>
  <a class="back" href="index.html">← 回工具箱</a>
</header>
<main>
  <div class="tabs">
    <button class="tab on" onclick="showTab('gen')"><span class="e">🧩</span>料號產生器</button>
    <button class="tab" onclick="showTab('find')"><span class="e">🔎</span>料號查詢</button>
  </div>

  <!-- ===== 產生器 ===== -->
  <div id="p-gen" class="panel on">
    <div class="card">
      <h2>🧩 智慧料號產生器</h2>
      <div class="sub">打上品名（例：<code>250ml 威士忌梅酒</code>），系統自動判讀容量、口味，<b>猜不到的欄位會標黃、由你確認</b>。組出料號後會比對現有主檔防止重複。</div>
      <label class="fl">品名（自由輸入，自動解析）</label>
      <input type="text" id="pn" class="big-in" placeholder="例：250ml 威士忌梅酒　／　700ml 東方美人茶梅酒" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:16px">
        <div><label class="fl">屬性</label><select id="s-attr"></select></div>
        <div><label class="fl">廠牌</label><select id="s-brand"></select></div>
        <div><label class="fl">容量</label><select id="s-vol"></select></div>
        <div><label class="fl">品項／口味碼</label><select id="s-item"></select></div>
        <div><label class="fl">變體</label><select id="s-var"></select></div>
      </div>
      <div class="out">
        <label class="fl">產生的料號</label>
        <div class="sku-box">
          <div class="sku" id="sku">—</div>
          <button class="copy" id="cp" onclick="copySku()">複製</button>
        </div>
        <div class="pv" id="pv"></div>
        <div class="warn" id="warn"></div>
      </div>
    </div>
    <div class="foot" id="snap"></div>
  </div>

  <!-- ===== 查詢 ===== -->
  <div id="p-find" class="panel">
    <div class="card">
      <h2>🔎 料號對照查詢</h2>
      <div class="sub">搜品名、料號、舊碼、條碼都可以；點類別鈕篩選。</div>
      <div class="search-wrap"><span class="si">🔎</span><input type="text" id="q" placeholder="輸入關鍵字…（東方美人 / A-PM-700 / 4711100 / PMBT06）" autocomplete="off"></div>
      <div class="filters" id="filters"></div>
      <div class="cnt" id="cnt"></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>料號(SKU)</th><th>品名</th><th>類別</th><th>容量</th><th>單位</th><th>國際條碼</th><th>舊碼</th><th>狀態</th></tr></thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>
    <div class="foot" id="snap2"></div>
  </div>
</main>

const PW_HASH='b74583d0f9d2a4a4f89963602faa42a2c6e5b50dd030431b20388f09406aaa3e';

async function checkPw(){
  const v=document.getElementById('pw-input').value;
  if(await sha256(v)===PW_HASH){sessionStorage.setItem('pw_ok','1');document.getElementById('pw-screen').classList.add('hide');}
  else{document.getElementById('pw-error').textContent='密碼錯誤，請再試一次';document.getElementById('pw-input').value='';document.getElementById('pw-input').focus();}
}

// ---- 建下拉 ----
function opt(v,t){const o=document.createElement('option');o.value=v;o.textContent=t;return o}
ATTR.forEach(([v,t])=>$('s-attr').append(opt(v,`${v}　${t}`)));

// ---- 解析品名 ----
function parse(){
  const t=$('pn').value.trim();
  let guessAttr='A',guessVol=null,guessItem=null;const chips=[];
  if(!t){$('chips').innerHTML='';return {};}
  // 容量
  const m=t.match(/(\d{2,4})\s*ml/i);
  if(m){guessVol=String(m[1]).padStart(3,'0');chips.push(['ok','容量',guessVol]);}
  else chips.push(['ask','容量','未偵測→請選']);
  // 口味
  for(const [k,c] of KW){if(t.includes(k)){guessItem=c;chips.push(['ok','口味',`${c}（${FLAV[c]||k}）`]);break;}}
  if(!guessItem)chips.push(['ask','口味','未對應→請選/輸入']);
  // 屬性
  if(/(標籤)/.test(t))guessAttr='M';
  else if(/(小樣|試飲|樣品)/.test(t))guessAttr='S';
  else if(/(禮盒|禮組|獲獎|典藏|雙馬|組合|入組)/.test(t))guessAttr='B';
  else if(/(杯|帆布袋|紙袋|提袋|紙箱|紙盒|茶葉罐|茶罐)/.test(t))guessAttr='M';
  chips.push([guessAttr!=='A'?'ok':'ask','屬性',ATTR.find(a=>a[0]===guessAttr)[1]+(guessAttr==='A'?'（預設）':'')]);
  // 入數提示
  const mi=t.match(/(\d+)\s*入/);if(mi)chips.push(['ask','入數',mi[1]+'入（如需，品項碼手動加）']);
  $('chips').innerHTML=chips.map(([c,k,v])=>`<span class="chip ${c}">${k}：<b>${v}</b></span>`).join('');
  return {guessAttr,guessVol,guessItem};
}

// 品名輸入 → 帶入下拉猜測 → compose
$('pn').addEventListener('input',()=>{
  const g=parse();
  if(g.guessAttr)$('s-attr').value=g.guessAttr;
  if(g.guessVol){if(!VOLS.includes(g.guessVol))$('s-vol').append(opt(g.guessVol,g.guessVol));$('s-vol').value=g.guessVol;}
  if(g.guessItem)$('s-item').value=g.guessItem;
  compose(false);
});

// ---- 組料號 ----
function compose(){
  const a=$('s-attr').value,b=$('s-brand').value,v=$('s-vol').value,it=$('s-item').value,vr=$('s-var').value;
  if(!it){$('sku').textContent='—';$('pv').textContent='選好「品項／口味碼」才能組出料號';$('warn').className='warn';return;}
  let sku=`${a}-${b}-${v}-${it}`;if(vr)sku+=`-${vr}`;
  $('sku').textContent=sku;
  $('pv').innerHTML=`段式：<code>${a}</code>-<code>${b}</code>-<code>${v}</code>-<code>${it}</code>`+(vr?`-<code>${vr}</code>`:'')+`　→ ${ATTR.find(x=>x[0]===a)[1]}／${BRAND.find(x=>x[0]===b)[1]}／${v==='000'?'無容量':v+'ml'}／${FLAV[it]||it}`;
  const hit=skuSet.get(sku.toUpperCase());
  const w=$('warn');
  if(hit){w.className='warn dup';w.innerHTML=`⚠️ <b>此料號已存在</b>：${hit.name}　<span class="st ${hit.status==='上架'?'':'off'}">[${hit.status||'—'}]</span><br>別重複建檔——若是新品，換個品項碼或加變體。`;}
  else{w.className='warn newok';w.innerHTML=`✅ <b>主檔中無此料號</b>，可作為新品建檔。（建好記得回填主檔）`;}
  $('cp').className='copy';$('cp').textContent='複製';
}
function copySku(){
  const s=$('sku').textContent;if(!s||s==='—')return;
  navigator.clipboard.writeText(s).then(()=>{$('cp').className='copy done';$('cp').textContent='已複製 ✓';});
}

// ---- 查詢 ----
let curFilter='ALL';
const FBTN=[['ALL','全部'],['A','成品'],['B','禮盒'],['S','樣品'],['G','贈品'],['M','包材/標籤']];
FBTN.forEach(([v,t])=>{const b=document.createElement('button');b.className='fbtn'+(v==='ALL'?' on':'');b.textContent=t;b.onclick=()=>{curFilter=v;document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};$('filters').append(b);});
function clsCode(c){return {'成品':'A','組合禮盒':'B','樣品':'S','贈品周邊':'G','包材耗材':'M'}[c]||'M';}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const rows=DATA.filter(d=>{
    if(curFilter!=='ALL'&&clsCode(d.cls)!==curFilter)return false;
    if(!q)return true;
    return (d.sku+' '+d.name+' '+d.barcode+' '+d.old+' '+d.cls).toLowerCase().includes(q);
  });
  $('cnt').textContent=`共 ${rows.length} 筆`+(q||curFilter!=='ALL'?`（總 ${DATA.length}）`:'');
  if(!rows.length){$('tb').innerHTML='<tr><td colspan="8" class="empty">查無資料</td></tr>';return;}
  $('tb').innerHTML=rows.map(d=>{const cc=clsCode(d.cls);
    return `<tr><td class="mono">${d.sku}</td><td>${d.name}</td>`+
      `<td><span class="badge b-${cc}">${d.cls}</span></td>`+
      `<td>${d.vol&&d.vol!=='000'?d.vol+'ml':'—'}</td><td>${d.unit||''}</td>`+
      `<td class="mono" style="font-weight:400">${d.barcode||'—'}</td>`+
      `<td style="color:#999">${d.old||'—'}</td>`+
      `<td><span class="st ${d.status==='上架'?'':'off'}">${d.status||'—'}</span></td></tr>`;
  }).join('');
}
$('q').addEventListener('input',render);

// ---- tab ----
function showTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',(t==='gen')===(i===0)));
  $('p-gen').classList.toggle('on',t==='gen');
  $('p-find').classList.toggle('on',t==='find');
}
// init
$('snap').textContent=$('snap2').textContent=`資料快照：${SNAPSHOT}　·　主檔 ${DATA.length} 筆（僅梅侍 PM）`;
compose(false);render();
</script>
</body>
